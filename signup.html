<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TrackSeeds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css-f/signup.css">
</head>

<body>

    <!-- Signup Section -->
    <section class="signup-section">
        <div class="signup-box">

            <!-- Left Side Image -->
            <div class="signup-image">
                <img src="css-f/img/flow(page).jpg" alt="Seeds">
                <div class="overlay">
                    <h2>Join TrackSeeds!</h2>
                    <p>Create your account and start tracking your seeds today</p>
                </div>
            </div>

            <!-- Right Side Form -->
            <div class="signup-form">
                <form action="auth/register.php" method="POST">
                    <h3>Create Your Account</h3>
                    <p>Enter your details below</p>

                    <div id="error-msg" style="color:red; margin-bottom:10px;"></div>

                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Full Name" name="fullname">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email Address" name="email">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" placeholder="Phone Number" name="phone">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" name="password">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Confirm Password" name="confirm_password">
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox"> I agree to
                            <a href="#">Terms & Conditions</a>
                        </label>
                    </div>

                    <button class="signup-submit-btn">Sign Up</button>

                    <p class="switch-text">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                    <p class="back-home">
                        <a href="index.html">
                            <i class="fas fa-arrow-left"></i> Back to Home
                        </a>
                    </p>



                </form>

            </div>
        </div>
    </section>


    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        let message = "";

        if (error === "empty") {
            message = "Please fill all fields.";
        }
        else if (error === "mismatch") {
            message = "Passwords do not match.";
        }
        else if (error === "weak") {
            message = "Password must be at least 6 characters.";
        }
        else if (error === "exists") {
            message = "Email already registered.";
        }
        else if (error === "failed") {
            message = "Something went wrong. Try again.";
        }

        if (message) {
            document.getElementById("error-msg").innerText = message;
        }
    </script>
</body>

</html>
