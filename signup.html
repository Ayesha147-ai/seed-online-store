<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Page ki basic HTML settings define kar rahe hain. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TrackSeeds</title>

    <!-- Font Awesome icons ke liye external stylesheet load kar rahe hain. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Signup page ki CSS file load kar rahe hain. -->
    <link rel="stylesheet" href="css-f/signup.css">
</head>

<body>

    <!-- Signup Section -->
    <!-- User registration ka main section. -->
    <section class="signup-section">
        <div class="signup-box">

            <!-- Left Side Image -->
            <!-- Signup page ke left side par promotional image aur text show hota hai. -->
            <div class="signup-image">
                <img src="css-f/img/herb(page).jpg" alt="Seeds">
                <div class="overlay">
                    <h2>Join TrackSeeds!</h2>
                    <p>Create your account and start tracking your seeds today</p>
                </div>
            </div>

            <!-- Right Side Form -->
            <!-- User ki registration information enter karne ka form. -->
            <div class="signup-form">
                <form action="auth/register.php" method="POST">
                <h3>Create Your Account</h3>
                <p>Enter your details below</p>

                <!-- User ka full name input. -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Full Name" name="fullname">
                </div>

                <!-- User ka email address input. -->
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email Address" name="email">
                </div>

                <!-- User ka phone number input. -->
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" placeholder="Phone Number" name="phone">
                </div>

                <!-- User ka password input. -->
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" name="password" id="signupPassword">
                    <i class="fas fa-eye toggle-password-icon" onclick="toggleField('signupPassword', this)"></i>
                </div>

                <!-- Password confirmation input. -->
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Confirm Password" name="confirm_password" id="confirmPassword">
                    <i class="fas fa-eye toggle-password-icon" onclick="toggleField('confirmPassword', this)"></i>
                </div>

                <!-- Role Selector -->
                <!-- User yahan choose karta hai ke woh farmer ya agent ke taur par register karna chahta hai. -->
                <div class="form-options role-select">
                    <p style="margin-bottom:8px; font-weight:600;">How would you like to register?</p>

                    <!-- Farmer role ka option. -->
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
                        <input type="radio" name="role" value="farmer" checked>
                        Farmer (Buy seeds)
                    </label>

                    <!-- Agent role ka option. -->
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin-top:6px;">
                        <input type="radio" name="role" value="agent">
                        Agent (Sell / supply seeds)
                    </label>
                </div>

                <!-- Terms and Conditions accept karne ka checkbox. -->
                <div class="form-options">
                    <label>
                        <input type="checkbox"> I agree to 
                        <a href="#">Terms & Conditions</a>
                    </label>
                </div>

                <!-- Registration form submit karne wala button. -->
                <button class="signup-submit-btn">Sign Up</button>

                <!-- Existing account wale users ke liye login link. -->
                <p class="switch-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <!-- User ko home page par wapas le jane wala link. -->
                <p class="back-home">
                    <a href="index.html">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                </p>

                </form>
            </div>
        </div>
    </section>

    <!-- Password Show/Hide Script -->
    <script>
    function toggleField(inputId, icon) {
        const field = document.getElementById(inputId);
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    </script>

    <!-- JavaScript code jo URL se error messages read karke screen par show karta hai -->
    <script>
// Error messages URL se read karo
const params = new URLSearchParams(window.location.search);
const error  = params.get('error');

// Mukhtalif error codes ke mukhtalif messages define kiye gaye hain
const messages = {
    'empty':          'All required fields must be filled.',
    'invalid_email':  'Please enter a valid email address.',
    'mismatch':       'Password and Confirm Password do not match.',
    'weak':           'Password must be at least 6 characters.',
    'exists':         'An account with this email already exists.',
    'failed':         'Registration failed. Please try again.'
};

if (error && messages[error]) {
    // Error div banao
    const div = document.createElement('div');
    div.style.cssText = `
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
        font-family: 'Spartan', sans-serif;
    `;
    div.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + messages[error];

    // Signup form ke upar insert karo
    const form = document.querySelector('.signup-form');
    if (form) form.insertBefore(div, form.querySelector('h3').nextSibling);
}
</script>

</body>
</html>
