<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - TrackSeeds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css-f/myaccount.css">
</head>
<body>

    <div class="account-card" id="account-card" style="display:none;">
        <div class="account-header">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <h2 id="acc-name">—</h2>
            <p id="acc-role">—</p>
        </div>

        <div id="msgBox"></div>

        <div class="account-body" id="account-body">
            <div class="info-row">
                <i class="fas fa-user"></i>
                <div style="flex:1;">
                    <div class="label">Full Name</div>
                    <div class="value" id="acc-name-val">—</div>
                    <input type="text" id="acc-name-input">
                </div>
            </div>
            <div class="info-row">
                <i class="fas fa-envelope"></i>
                <div style="flex:1;">
                    <div class="label">Email</div>
                    <div class="value" id="acc-email">—</div>
                    <input type="email" id="acc-email-input">
                </div>
            </div>
            <div class="info-row">
                <i class="fas fa-phone"></i>
                <div style="flex:1;">
                    <div class="label">Phone</div>
                    <div class="value" id="acc-phone">—</div>
                    <input type="text" id="acc-phone-input">
                </div>
            </div>
            <div class="info-row">
                <i class="fas fa-map-marker-alt"></i>
                <div><div class="label">Location</div><div class="value" id="acc-location">—</div></div>
            </div>
            <div class="info-row">
                <i class="fas fa-calendar"></i>
                <div><div class="label">Member Since</div><div class="value" id="acc-since">—</div></div>
            </div>
        </div>

        <div class="account-actions">
            <a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> Home</a>
            <button class="btn-edit" id="editBtn" onclick="enableEdit()"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn-save" id="saveBtn" onclick="saveProfile()"><i class="fas fa-check"></i> Save</button>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
        </div>
    </div>

    <div id="loading">Loading your account...</div>

    <script src="js-f/myaccount.js"></script>

</body>
</html>
